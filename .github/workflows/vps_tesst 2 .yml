name: VPS Windows

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Tai va Giai nen Ngrok
      run: |
        Invoke-WebRequest -Uri "https://bin.equinox.io/c/b3M4120/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
        Expand-Archive -Path "ngrok.zip" -DestinationPath "."

    - name: Ket noi Ngrok
      run: |
        .\ngrok.exe authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Bat Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        net user runneradmin MatKhau123456@

    - name: Chay VPS
      run: |
        .\ngrok.exe tcp 3389
