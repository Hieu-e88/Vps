name: Tao VPS Windows

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Bat Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        net user runneradmin MatKhau123456@

    - name: Chay VPS voi Pinggy
      run: |
        ssh -p 443 -R 0:localhost:3389 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 a.pinggy.io
